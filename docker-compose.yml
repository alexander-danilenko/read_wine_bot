# Local PostgreSQL for the bot. Settings come from .env; copy .env.example to .env first.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The bot itself, built from the Dockerfile. Uncomment to run it in Docker instead of `go run .`.
  # bot:
  #   build: .
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     # Inside compose the database host is the service name, not localhost.
  #     DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   # A winner draw can spend up to a minute per Telegram call; Docker's 10 s default would cut it off.
  #   stop_grace_period: 2m

volumes:
  pgdata:

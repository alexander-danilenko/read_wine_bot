# Local PostgreSQL for the bot. The bot connects with DATABASE_URL from .env.example.
# The credentials apply only when the data volume is first created; to change them later,
# run `docker compose down -v` (deletes the data).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: read_wine_bot
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

#  # The bot itself, built from the Dockerfile. Uncomment to run it in Docker instead of `go run .`.
#  bot:
#    build: .
#    restart: unless-stopped
#    env_file: .env
#    environment:
#      # Inside compose the database host is the service name, not localhost.
#      DATABASE_URL: postgres://postgres:postgres@db:5432/read_wine_bot?sslmode=disable
#    depends_on:

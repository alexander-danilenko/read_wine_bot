# GoReleaser builds the GitHub Release; .github/workflows/release.yml runs it when a push to main
# bumps const version in main.go. The version lives in that const, not in ldflags.
version: 2

builds:
  - env:
      - CGO_ENABLED=0 # static binary, same as the Dockerfile
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    files: [README.md, .env.example]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'

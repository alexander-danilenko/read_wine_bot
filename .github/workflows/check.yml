# Runs the same checks as the Claude Code hooks, for every push and pull request. GitHub's own
# actions/* run at their latest major tag; every third-party action is pinned to a commit SHA with
# its version in a comment, and the workflows job enforces it.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13 # the version .golangci.yml was tested with, see CLAUDE.md

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: "**/*.md"

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Every third-party action is pinned to a commit SHA
        run: |
          if grep -rnE '^\s*(- )?uses:' .github/workflows | grep -vE 'uses: (actions/[^@]+@v[0-9]+|[^@]+@[0-9a-f]{40})( |$)'; then
            echo "pin these third-party actions to a full commit SHA, with the version in a comment" >&2
            exit 1
          fi

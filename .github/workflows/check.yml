# Runs the same checks as the Claude Code hooks, for every push and pull request. Every action runs
# at its stable major tag, so it picks up patch and security releases without a commit here.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # The bot embeds the Mini App, so the web build runs before every Go step.
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - run: go build ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13 # the version .golangci.yml was tested with, see CLAUDE.md

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@latest
